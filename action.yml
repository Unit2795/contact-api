name: Deploy contact-api
description: Validate a contact-api config, build, and optionally deploy it with Terraform.

# Called from a private config repo with uses: Unit2795/contact-api@vX.Y.Z.
# GitHub fetches this repo at that tag into github.action_path, so the deployed code is always the pinned version.
# The caller must check out its config repo first, and grant id-token: write when apply is true.

inputs:
  config-dir:
    description: Directory in the caller's workspace holding forms.json and state.config.
    default: "."
  apply:
    description: "true: validate, then deploy and smoke test. false: validate only; no AWS access needed (use for PRs)."
    default: "false"
  aws-role-arn:
    description: OIDC role to assume. Required when apply is true.
    default: ""
  aws-region:
    description: Region to deploy to. The state bucket's region is set separately in state.config.
    default: us-east-1

runs:
  using: composite
  steps:
    # Inputs are passed to scripts through env, not ${{ }} interpolation, so their values are never run as shell code.
    - name: Load config
      shell: bash
      env:
        CONFIG_DIR: ${{ inputs.config-dir }}
      run: |
        config="$GITHUB_WORKSPACE/$CONFIG_DIR"
        cp "$config/forms.json" "$GITHUB_ACTION_PATH/forms.json"
        cp "$config/state.config" "$GITHUB_ACTION_PATH/terraform/state.config"

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    # A forms.json that this version rejects fails here, in pnpm test, before anything touches AWS.
    - name: Validate and build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install -g "$(node -p "require('./package.json').packageManager")"
        pnpm install --frozen-lockfile
        pnpm test
        pnpm typecheck
        pnpm build

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform validate
      if: inputs.apply != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/terraform
      run: |
        terraform init -input=false -backend=false
        terraform validate

    - uses: aws-actions/configure-aws-credentials@v5
      if: inputs.apply == 'true'
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        role-session-name: contact-api-deploy
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform apply
      if: inputs.apply == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/terraform
      env:
        TF_VAR_aws_region: ${{ inputs.aws-region }}
      run: |
        # Reserving 5 concurrent executions (the reserved_concurrency default) needs an account limit of at least 105, because AWS keeps 100 unreserved.
        # New accounts often start lower. Below 105, deploy without reserved concurrency, and the account limit bounds cost instead.
        # If the role can't read the limit, deploy with the reservation as usual.
        limit="$(aws lambda get-account-settings --query AccountLimit.ConcurrentExecutions --output text 2>/dev/null || true)"
        if [ -n "$limit" ] && [ "$limit" -lt 105 ]; then
          echo "::warning::The account's Lambda concurrency limit is $limit, below the 105 needed to reserve 5. Deploying without reserved concurrency. Ask AWS to raise the 'Concurrent executions' quota to turn the cap on."
          export TF_VAR_reserved_concurrency=-1
        fi
        terraform init -input=false -backend-config=state.config
        terraform apply -auto-approve -input=false -lock-timeout=5m

    # Safe e2e checks against the first form's site; never sends email.
    - name: Smoke test
      if: inputs.apply == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # A form can inherit site from defaults, so merge them as e2e.ts does.
        site="$(jq -r '(.defaults // {}) + (.forms | to_entries[0].value) | .site' forms.json)"
        key="$(aws ssm get-parameter --with-decryption --name "/contact-api/sites/$site/origin-key" --query Parameter.Value --output text)"
        echo "::add-mask::$key"
        CONTACT_URL="https://$(terraform -chdir=terraform output -raw origin_domain)" CONTACT_SITE_KEY="$key" pnpm e2e
