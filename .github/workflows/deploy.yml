name: Test and Deploy

# One deploy at a time; never cancel mid-apply to avoid half-applied infrastructure.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v5

      # pnpm must be installed before Node: https://github.com/actions/setup-node/issues/530
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Everything below deploys; pull requests stop here.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: contact-api-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: github.event_name != 'pull_request'
        with:
          terraform_wrapper: false

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: |
          terraform init -input=false -backend-config=state.config
          terraform apply -auto-approve -input=false -lock-timeout=5m

      # Safe e2e checks against the first form's site; never sends email.
      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          site="$(jq -r '.forms | to_entries[0].value.site' forms.json)"
          key="$(aws ssm get-parameter --with-decryption --name "/contact-api/sites/$site/origin-key" --query Parameter.Value --output text)"
          echo "::add-mask::$key"
          CONTACT_URL="https://$(terraform -chdir=terraform output -raw origin_domain)" CONTACT_SITE_KEY="$key" pnpm e2e
