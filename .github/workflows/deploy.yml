name: Test and Deploy

# One deploy at a time; never cancel mid-apply to avoid half-applied infrastructure.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v5

      # pnpm must be installed before Node: https://github.com/actions/setup-node/issues/530
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Everything below deploys; pull requests stop here.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: contact-api-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: github.event_name != 'pull_request'
        with:
          terraform_wrapper: false

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: |
          terraform init -input=false -backend-config=state.config
          terraform apply -auto-approve -input=false -lock-timeout=5m

      # Cheap post-deploy checks; they never send email.
      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          url="https://$(terraform -chdir=terraform output -raw origin_domain)"
          param="$(terraform -chdir=terraform output -json site_key_parameters | jq -r 'to_entries[0].value')"
          key="$(aws ssm get-parameter --with-decryption --name "$param" --query Parameter.Value --output text)"

          code="$(curl -s -o /dev/null -w '%{http_code}' "$url/api/stamp.gif")"
          [ "$code" = 403 ] || { echo "Expected 403 without site key, got $code"; exit 1; }

          headers="$(curl -s -D - -o /dev/null -H "x-contact-site-key: $key" "$url/api/stamp.gif")"
          echo "$headers" | grep -q '^HTTP/[0-9.]* 200' || { echo "Stamp request failed:"; echo "$headers"; exit 1; }
          echo "$headers" | grep -qi '^set-cookie: stamp=' || { echo "Stamp cookie missing:"; echo "$headers"; exit 1; }
          echo "Smoke test passed using $param"
